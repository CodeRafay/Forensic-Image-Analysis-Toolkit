[theme]
base="dark"
primaryColor="#4c8dff"
backgroundColor="#0e1117"
secondaryBackgroundColor="#262730"
textColor="#fafafa"
font="sans serif"

[server]
headless = true
maxUploadSize = 25  # MB; with the 40 MP pixel cap in app.py
port = 8501

[client]
showErrorDetails = "type"

[logger]
level = "info"
